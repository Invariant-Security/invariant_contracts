# Pure Python, sem Docker/Postgres/Playwright -- roda em segundos. É a
# pipeline mais enxuta dos 5 repos invariant_*, exatamente porque este é o
# único que não fala com nada externo (nem banco, nem alvo, nem PDF).
name: ci

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

permissions:
  contents: read

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: pytest tests/ -q
