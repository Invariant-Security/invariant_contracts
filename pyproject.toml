[project]
name = "invariant_contracts"
version = "0.1.0"
description = "Shared Pydantic contracts crossing invariant_* service boundaries."
requires-python = ">=3.11"
dependencies = ["pydantic>=2"]

[project.optional-dependencies]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/invariant_contracts"]
