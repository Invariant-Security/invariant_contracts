[project]
name = "invariant_contracts"
version = "0.4.0"
description = "Shared Pydantic contracts crossing invariant_* service boundaries."
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = ["pydantic>=2"]

[project.optional-dependencies]
dev = ["pytest", "pytest-timeout"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/invariant_contracts"]

[tool.pytest.ini_options]
timeout = 300
faulthandler_timeout = 120
